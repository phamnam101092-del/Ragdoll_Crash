    if (state.shake > 0) state.shake *= 0.85;
    if (state.hitFlash > 0) state.hitFlash = Math.max(0, state.hitFlash - 0.05);
  }

  const DEATH_LABELS = {
    mine: '💥 Exploded by Proximity Mine',
    spike: '📌 Impaled on Spike Trap',
    saw: '🪚 Sliced by Spinning Sawblade',
    abyss: '🕳️ Fell into the Abyss',
    trapdoor: '🕳️ Dropped into Hidden Trapdoor',
    popup_spike: '🗡️ Caught by Hidden Pop-up Spikes',
    drop_ambush: '🪨 Crushed by Overhead Ambush Trap',
    dead: '💀 Crushed by Wrecking Ball'
  };

  function showCrashSummary(isDead = true) {
    state.summaryShown = true;
    syncBestScore();

    summaryCard.classList.toggle('is-dead', isDead);
    summaryTag.textContent = '💀 Wasted — Game Over';
    summaryScore.textContent = `${state.score.toLocaleString()} m`;
    summaryNewBest.classList.toggle('visible', state.isNewBest && state.score > 0);
    summaryGrade.textContent = DEATH_LABELS[state.deathReason] || DEATH_LABELS.dead;
    summaryMeta.textContent = `🏆 Best: ${bestScore.toLocaleString()} m • ⚡ Lv.${state.level} • 🚀 Top: ${state.maxSpeedKmh} km/h`;
    if (touchDock) touchDock.classList.add('modal-open');
    summaryCard.classList.add('visible');
  }

  // =========================================================================
  // 5. RESPONSIVE 60FPS CANVAS RENDERING
  // =========================================================================
  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    const cw = Math.max(240, rect.width || window.innerWidth || 360);
    const ch = Math.max(180, rect.height || window.innerHeight || 400);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(cw * dpr);
    canvas.height = Math.floor(ch * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    updateCamScale();
  }

  function bgHash(n) {
    const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  function drawBackground(viewW, viewH) {
    const nowSec = state.animTime;
    const horizonY = Math.max(viewH * 0.28, Math.min(viewH * 0.74, viewH * 0.62 - state.camY * 0.16));

    // 1. Vibrant sky gradient
    const skyGrad = ctx.createLinearGradient(0, 0, 0, horizonY + 40);
    skyGrad.addColorStop(0, '#0c4a6e');
    skyGrad.addColorStop(0.5, '#0284c7');
    skyGrad.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, viewW + 2, horizonY + 42);

    // Warm sun + soft glow
    const sunX = viewW * 0.78 - ((state.camX * 0.01) % 60);
    const sunY = Math.max(46, horizonY * 0.26);
    const sunGlow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 72);
    sunGlow.addColorStop(0, 'rgba(254, 240, 138, 0.95)');
    sunGlow.addColorStop(0.35, 'rgba(253, 224, 71, 0.35)');
    sunGlow.addColorStop(1, 'rgba(253, 224, 71, 0)');
    ctx.fillStyle = sunGlow;
    ctx.beginPath();
    ctx.arc(sunX, sunY, 72, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#fef08a';
    ctx.beginPath();
    ctx.arc(sunX, sunY, 20, 0, Math.PI * 2);
    ctx.fill();

    // 2. Drifting clouds (slow parallax + gentle wind motion)
    const cloudSpan = viewW + 320;
    for (let i = 0; i < 6; i++) {
      const seed = i * 19 + 7;
      const cw = 64 + bgHash(seed) * 54;
      const speed = 8 + bgHash(seed + 1) * 8;
      const rawX = (i * (cloudSpan / 6) - state.camX * 0.07 - nowSec * speed);
      const cx = ((rawX % cloudSpan) + cloudSpan) % cloudSpan - 160;
      const cy = 28 + bgHash(seed + 2) * Math.max(40, horizonY * 0.52);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
      ctx.beginPath();
      ctx.arc(cx, cy, cw * 0.24, 0, Math.PI * 2);
      ctx.arc(cx + cw * 0.22, cy - cw * 0.08, cw * 0.30, 0, Math.PI * 2);
      ctx.arc(cx + cw * 0.48, cy, cw * 0.22, 0, Math.PI * 2);
      ctx.fill();
    }

    // Tiny distant birds
    ctx.strokeStyle = 'rgba(15, 23, 42, 0.55)';
    ctx.lineWidth = 1.6;
    for (let i = 0; i < 4; i++) {
      const span = viewW + 220;
      const rawBx = i * 190 - state.camX * 0.1 + nowSec * (18 + i * 3);
      const bx = ((rawBx % span) + span) % span - 110;
      const by = 45 + i * 22 + Math.sin(nowSec * 3 + i) * 4;
      const flap = Math.sin(nowSec * 9 + i * 2) * 3.5;
      ctx.beginPath();
      ctx.moveTo(bx - 6, by + flap);
      ctx.quadraticCurveTo(bx - 3, by - 4, bx, by);
      ctx.quadraticCurveTo(bx + 3, by - 4, bx + 6, by + flap);
      ctx.stroke();
    }

    // 3. Distant blue-teal mountain silhouettes (parallax 0.14)
    const mSpacing = 170;
    const mScroll = state.camX * 0.14;
    const mStart = Math.floor(mScroll / mSpacing) - 1;
    const mEnd = Math.ceil((mScroll + viewW) / mSpacing) + 1;
    ctx.fillStyle = '#25527a';
    ctx.beginPath();
    ctx.moveTo(-20, horizonY + 20);
    for (let i = mStart; i <= mEnd; i++) {
      const mx = i * mSpacing - mScroll;
      const peakH = 52 + bgHash(i * 13) * 68;
      ctx.lineTo(mx + mSpacing * 0.5, horizonY - peakH);
      ctx.lineTo(mx + mSpacing, horizonY + 10);
    }
    ctx.lineTo(viewW + 40, horizonY + 20);
    ctx.closePath();
    ctx.fill();

    // 4. Rolling lush green hills + meadow base (parallax 0.28)
    const hScroll = state.camX * 0.28;
    ctx.fillStyle = '#15803d';
    ctx.beginPath();
    ctx.moveTo(-20, viewH + 20);
    ctx.lineTo(-20, horizonY);
    for (let x = -20; x <= viewW + 40; x += 24) {
      const wx = x + hScroll;
      const hillY = horizonY - 14 - Math.sin(wx * 0.0055) * 22 - Math.cos(wx * 0.011) * 10;
      ctx.lineTo(x, hillY);
    }
    ctx.lineTo(viewW + 40, viewH + 20);
    ctx.closePath();
    ctx.fill();

    // 5. Far green tree line (parallax 0.42)
    const farSpacing = 82;
    const farScroll = state.camX * 0.42;
    const farStart = Math.floor(farScroll / farSpacing) - 2;
    const farEnd = Math.ceil((farScroll + viewW) / farSpacing) + 2;
    for (let i = farStart; i <= farEnd; i++) {
      const r1 = bgHash(i * 31 + 5);
      const r2 = bgHash(i * 31 + 9);
      const tx = i * farSpacing - farScroll + (r1 - 0.5) * 22;
      const baseY = horizonY + 6 - Math.sin((i * farSpacing + hScroll * 0.65) * 0.0055) * 10;
      const th = 36 + r2 * 26;

      // Trunk
      ctx.fillStyle = '#4a3222';
      ctx.fillRect(tx - 3, baseY - 14, 6, 18);

      // Foliage (pine vs leafy)
      if (r1 > 0.48) {
        ctx.fillStyle = '#166534';
        ctx.beginPath();
        ctx.moveTo(tx, baseY - th);
        ctx.lineTo(tx - 18, baseY - 12);
        ctx.lineTo(tx + 18, baseY - 12);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.arc(tx, baseY - th * 0.62, 16 + r2 * 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Lower meadow floor gradient behind foreground terrain
    const meadowGrad = ctx.createLinearGradient(0, horizonY + 4, 0, viewH);
    meadowGrad.addColorStop(0, '#166534');
    meadowGrad.addColorStop(0.35, '#14532d');
    meadowGrad.addColorStop(1, '#0b2919');
    ctx.fillStyle = meadowGrad;
    ctx.fillRect(0, horizonY + 8, viewW + 2, viewH - horizonY + 2);

    // 6. Mid-foreground vibrant green tree row scrolling with player (parallax 0.62)
    const treeSpacing = 115;
    const treeScroll = state.camX * 0.62;
    const tStart = Math.floor(treeScroll / treeSpacing) - 2;
    const tEnd = Math.ceil((treeScroll + viewW) / treeSpacing) + 2;
    const treeBaseY = horizonY + 26;

    // Grassy ridge strip
    ctx.fillStyle = '#22c55e';
    ctx.fillRect(0, treeBaseY - 4, viewW, 6);

    for (let i = tStart; i <= tEnd; i++) {
      const r1 = bgHash(i * 47 + 3);
      const r2 = bgHash(i * 47 + 11);
      const r3 = bgHash(i * 47 + 17);
      const tx = i * treeSpacing - treeScroll + (r1 - 0.5) * 32;
      const scale = 0.85 + r2 * 0.5;
      const trunkH = 26 * scale;

      // Trunk
      ctx.fillStyle = '#6b4423';
      ctx.fillRect(tx - 4.5 * scale, treeBaseY - trunkH, 9 * scale, trunkH + 4);

      if (r3 > 0.45) {
        // Layered lush pine tree
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.moveTo(tx, treeBaseY - trunkH - 54 * scale);
        ctx.lineTo(tx - 24 * scale, treeBaseY - trunkH + 4);
        ctx.lineTo(tx + 24 * scale, treeBaseY - trunkH + 4);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.moveTo(tx, treeBaseY - trunkH - 64 * scale);
        ctx.lineTo(tx - 19 * scale, treeBaseY - trunkH - 18 * scale);
        ctx.lineTo(tx + 19 * scale, treeBaseY - trunkH - 18 * scale);
        ctx.closePath();
        ctx.fill();
      } else {
        // Fluffy bright green oak tree with highlight
        const cy = treeBaseY - trunkH - 20 * scale;
        ctx.fillStyle = '#15803d';
        ctx.beginPath();
        ctx.arc(tx - 12 * scale, cy + 6 * scale, 17 * scale, 0, Math.PI * 2);
        ctx.arc(tx + 12 * scale, cy + 6 * scale, 16 * scale, 0, Math.PI * 2);
        ctx.arc(tx, cy - 8 * scale, 21 * scale, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(tx - 5 * scale, cy - 12 * scale, 13 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      // Small green bush beside tree
      if (r2 > 0.4) {
        const bx = tx + 34 * scale;
        ctx.fillStyle = '#16a34a';
        ctx.beginPath();
        ctx.arc(bx, treeBaseY - 3, 9, 0, Math.PI * 2);
        ctx.arc(bx + 10, treeBaseY - 2, 7, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function render() {
    const w = canvas.clientWidth || window.innerWidth || 360;
    const h = canvas.clientHeight || window.innerHeight || 400;
    const sc = state.camScale;
    const viewW = w / sc;
    const viewH = h / sc;

    const target = ragdoll.chest;
    if (!state.dead) {
      const desiredCamX = target.x - viewW * 0.34;
      const desiredCamY = target.y - viewH * 0.48;
      state.camX += (desiredCamX - state.camX) * 0.14;
      state.camY += (desiredCamY - state.camY) * 0.12;
    }

    ctx.save();
    ctx.scale(sc, sc);
    drawBackground(viewW, viewH);

    const sx = state.dead ? 0 : (Math.random() - 0.5) * state.shake;
    const sy = state.dead ? 0 : (Math.random() - 0.5) * state.shake;
    ctx.translate(-state.camX + sx, -state.camY + sy);

    // Start Zone marker
    ctx.fillStyle = 'rgba(255, 183, 3, 0.28)';
    ctx.fillRect(20, 180, 10, 140);
    ctx.font = '900 13px system-ui, sans-serif';
    ctx.lineWidth = 3.5;
    ctx.strokeStyle = '#0b0f17';
    ctx.strokeText('LAUNCH ▶', 36, 202);
    ctx.fillStyle = '#ffb703';
    ctx.fillText('LAUNCH ▶', 36, 202);

    // Distance milestone signposts
    for (const sg of course.signs) {
      ctx.fillStyle = sg.major ? '#ffb703' : '#64748b';
      ctx.fillRect(sg.x - 2, sg.y - 44, 4, 44);
      ctx.fillStyle = sg.major ? '#1e293b' : '#0f172a';
      ctx.strokeStyle = sg.major ? '#ffb703' : '#64748b';
      ctx.lineWidth = 2;
      ctx.fillRect(sg.x - 26, sg.y - 68, 52, 24);
      ctx.strokeRect(sg.x - 26, sg.y - 68, 52, 24);
      ctx.fillStyle = sg.major ? '#ffd166' : '#e2e8f0';
      ctx.font = '900 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(sg.label, sg.x, sg.y - 52);
    }
    ctx.textAlign = 'left';

    // Danger chasm line across bottom of endless track
    const abyssLeft = state.camX - 120;
    const abyssWidth = viewW + 240;
    ctx.fillStyle = 'rgba(24, 10, 16, 0.85)';
    ctx.fillRect(abyssLeft, 920, abyssWidth, 320);
    ctx.fillStyle = '#ff4d4d';
    ctx.fillRect(abyssLeft, 920, abyssWidth, 4);

    for (const b of course.blocks) {
      if (b.broken) continue;
      ctx.save();
      ctx.translate(b.cx, b.cy);
      ctx.rotate(b.angle);

      if (b.type === 'crate') {
        ctx.fillStyle = '#c97b36';
        ctx.strokeStyle = '#6e3b11';
        ctx.lineWidth = 2.5;
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2);
        ctx.strokeRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2);
        ctx.beginPath();
        ctx.moveTo(-b.hw, -b.hh); ctx.lineTo(b.hw, b.hh);
        ctx.moveTo(b.hw, -b.hh); ctx.lineTo(-b.hw, b.hh);
        ctx.stroke();
      } else if (b.type === 'wall') {
        ctx.fillStyle = '#334155';
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2);
        ctx.fillStyle = '#ffb703';
        for (let y = -b.hh + 8; y < b.hh - 12; y += 28) {
          ctx.fillRect(-b.hw, y, 10, 14);
        }
      } else if (b.type === 'abyss') {
        ctx.fillStyle = '#1e1118';
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2);
        ctx.fillStyle = '#ff4d4d';
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, 4);
      } else if (b.type === 'trapdoor_hatch' || b.type === 'ambush_block') {
        // Rendered with subtle camouflage & warning state in hiddenTraps pass below
      } else {
        ctx.fillStyle = b.type === 'ramp' ? '#2c3d59' : '#253248';
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, b.hh * 2);
        ctx.fillStyle = b.type === 'ramp' ? '#ffb703' : '#475f85';
        ctx.fillRect(-b.hw, -b.hh, b.hw * 2, 5);
      }
      ctx.restore();
    }

    // Hidden obstacles (camouflaged until near or triggered)
    for (const t of course.hiddenTraps) {
      if (t.kind === 'trapdoor') {
        const halfW = t.w * 0.5;
        const swing = t.openProgress * 1.42;
        const shakeX = t.phase === 'warning' ? (Math.random() - 0.5) * 4 : 0;
        const shakeY = t.phase === 'warning' ? (Math.random() - 0.5) * 2.5 : 0;

        // Faint side hinges / crack cues only when approaching or triggered
        if (t.reveal > 0.05 || t.phase !== 'hidden') {
          ctx.fillStyle = t.phase === 'warning' ? '#ffb703' : `rgba(255, 183, 3, ${0.45 * t.reveal})`;
          ctx.fillRect(t.x - halfW - 2, t.y - 2, 4, 8);
          ctx.fillRect(t.x + halfW - 2, t.y - 2, 4, 8);
        }

        // Left & right hinged hatch leaves
        const leafW = halfW - 1;
        for (const side of [-1, 1]) {
          ctx.save();
          ctx.translate(t.x + side * halfW + shakeX, t.y + 3 + shakeY);
          ctx.rotate(side * -swing);
          ctx.fillStyle = t.phase === 'warning' ? '#334155' : '#253248';
          ctx.fillRect(side === -1 ? 0 : -leafW, -3, leafW, 16);
          ctx.fillStyle = t.phase === 'warning' ? '#ffb703' : '#475f85';
          ctx.fillRect(side === -1 ? 0 : -leafW, -3, leafW, 5);
          ctx.restore();
        }

        if (t.phase === 'warning') {
          ctx.strokeStyle = '#ff4d4d';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(t.x, t.y - 2);
          ctx.lineTo(t.x, t.y + 15);
          ctx.stroke();
        }
      } else if (t.kind === 'popup_spike') {
        // Nearly flush camouflaged road plate; sensor slit glints on approach
        ctx.fillStyle = '#334155';
        ctx.fillRect(t.x - t.w * 0.5, t.y - 3, t.w, 5);
        if (t.reveal > 0.05 || t.phase !== 'hidden') {
          ctx.fillStyle = t.phase === 'warning' ? '#ffb703' : `rgba(255, 77, 77, ${0.65 * t.reveal})`;
          ctx.fillRect(t.x - t.w * 0.35, t.y - 3, t.w * 0.7, 2);
        }
        if (t.rise > 0.02) {
          const effH = t.h * t.rise;
          const count = 3;
          const step = t.w / count;
          ctx.fillStyle = '#e2e8f0';
          ctx.strokeStyle = '#ff4d4d';
          ctx.lineWidth = 1.5;
          for (let i = 0; i < count; i++) {
            const sx = t.x - t.w * 0.5 + step * (i + 0.5);
            ctx.beginPath();
            ctx.moveTo(sx - step * 0.42, t.y);
            ctx.lineTo(sx, t.y - effH);
            ctx.lineTo(sx + step * 0.42, t.y);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
          }
        }
      } else if (t.kind === 'drop_ambush') {
        // Ground shadow/laser hint only when close or active
        const vis = t.phase === 'hidden' ? t.reveal * 0.55 : 0.95;
        if (vis > 0.04) {
          ctx.fillStyle = t.phase === 'warning'
            ? `rgba(255, 77, 77, ${0.45 + Math.sin(state.animTime * 40) * 0.3})`
            : `rgba(255, 77, 77, ${0.35 * vis})`;
          ctx.fillRect(t.x - t.w * 0.48, t.y - 4, t.w * 0.96, 4);

          ctx.strokeStyle = `rgba(255, 183, 3, ${0.28 * vis})`;
          ctx.lineWidth = 1.5;
          ctx.setLineDash([5, 6]);
          ctx.beginPath();
          ctx.moveTo(t.x, t.curY + t.h * 0.5);
          ctx.lineTo(t.x, t.y - 4);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // Camouflaged dark overhead block (subtle silhouette when hidden, bright warning when active)
        const blockAlpha = t.phase === 'hidden' ? (0.18 + t.reveal * 0.52) : 1;
        ctx.save();
        ctx.globalAlpha = blockAlpha;
        const jx = t.phase === 'warning' ? (Math.random() - 0.5) * 4 : 0;
        ctx.translate(t.x + jx, t.curY);
        ctx.fillStyle = '#1e293b';
        ctx.strokeStyle = t.phase === 'warning' || t.phase === 'active' ? '#ff4d4d' : '#475569';
        ctx.lineWidth = 2.5;
        ctx.fillRect(-t.w * 0.5, -t.h * 0.5, t.w, t.h);
        ctx.strokeRect(-t.w * 0.5, -t.h * 0.5, t.w, t.h);
        // Hazard stripes + bottom teeth
        ctx.fillStyle = '#ffb703';
        ctx.fillRect(-t.w * 0.42, -t.h * 0.25, t.w * 0.84, 6);
        ctx.fillStyle = '#e2e8f0';
        for (let i = -2; i <= 2; i++) {
          const tx = i * 10;
          ctx.beginPath();
          ctx.moveTo(tx - 4, t.h * 0.5);
          ctx.lineTo(tx, t.h * 0.5 + 8);
          ctx.lineTo(tx + 4, t.h * 0.5);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }
    }

    for (const sp of course.springs) {
      const lift = sp.bounce * 12;
      ctx.fillStyle = '#334155';
      ctx.fillRect(sp.x - sp.w / 2 + 6, sp.y - 6 - lift * 0.5, sp.w - 12, 6 + lift * 0.5);
      ctx.fillStyle = '#00e5ff';
      ctx.fillRect(sp.x - sp.w / 2, sp.y - sp.h - lift, sp.w, 8);
    }

    ctx.fillStyle = '#cbd5e1';
    ctx.strokeStyle = '#ff4d4d';
    ctx.lineWidth = 1.5;
    for (const sk of course.spikes) {
      ctx.beginPath();
      ctx.moveTo(sk.x - sk.w / 2, sk.y);
      ctx.lineTo(sk.x, sk.y - sk.h);
      ctx.lineTo(sk.x + sk.w / 2, sk.y);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    const blink = Math.floor((state.animTime * 1000) / 220) % 2 === 0;
    for (const m of course.mines) {
      if (m.exploded) continue;
      ctx.fillStyle = '#3f4a5c';
      ctx.beginPath();
      ctx.arc(m.x, m.y, m.r, Math.PI, 0);
      ctx.fill();
      ctx.fillStyle = blink ? '#ff2a2a' : '#7f1d1d';
      ctx.beginPath();
      ctx.arc(m.x, m.y - m.r * 0.65, 5, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const sw of course.saws) {
      ctx.save();
      ctx.translate(sw.x, sw.y);
      ctx.rotate(sw.angle);
      const teeth = 12;
      ctx.fillStyle = '#e2e8f0';
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < teeth * 2; i++) {
        const rad = i % 2 === 0 ? sw.r : sw.r * 0.72;
        const a = (i * Math.PI) / teeth;
        if (i === 0) ctx.moveTo(Math.cos(a) * rad, Math.sin(a) * rad);
        else ctx.lineTo(Math.cos(a) * rad, Math.sin(a) * rad);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ff4d4d';
      ctx.beginPath();
      ctx.arc(0, 0, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const p of course.pendulums) {
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(p.ax, p.ay);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    }

    for (const d of debris) {
      ctx.save();
      ctx.globalAlpha = d.life;
      ctx.translate(d.x, d.y);
      ctx.rotate(d.rot);
      ctx.fillStyle = d.color;
      ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
      ctx.restore();
    }

    drawVehicle();
    drawRagdoll();

    for (const sw of shockwaves) {
      ctx.save();
      ctx.globalAlpha = sw.life;
      ctx.strokeStyle = '#ffb703';
      ctx.lineWidth = 5 * sw.life;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (const pt of particles) {
      ctx.save();
      ctx.globalAlpha = pt.life;
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    for (const pop of popups) {
      ctx.save();
      ctx.globalAlpha = Math.min(1, pop.life * 1.4);
      ctx.translate(pop.x, pop.y);
      ctx.rotate(pop.rot);
      const s = pop.scale * (1 + (1 - pop.life) * 0.22);
      ctx.scale(s, s);
      ctx.font = '900 20px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0b0f17';
      ctx.strokeText(pop.text, 0, 0);
      ctx.fillStyle = pop.color;
      ctx.fillText(pop.text, 0, 0);
      ctx.restore();
    }

    if (!state.autoActive && !state.dead) {
      const pulse = Math.sin(state.animTime * 6) * 5;
      ctx.font = '900 14px system-ui, sans-serif';
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0b0f17';
      ctx.strokeText('TAP 🔥 TURBO TO START ▶▶', vehicle.frontWheel.x + 34 + pulse, vehicle.seatFront.y - 14);
      ctx.fillStyle = '#ffb703';
      ctx.fillText('TAP 🔥 TURBO TO START ▶▶', vehicle.frontWheel.x + 34 + pulse, vehicle.seatFront.y - 14);
    }

    ctx.restore();

    if (state.hitFlash > 0) {
      ctx.fillStyle = `rgba(255, 80, 60, ${state.hitFlash * 0.32})`;
      ctx.fillRect(0, 0, w, h);
    }
  }

  function drawVehicle() {
    const v = vehicle;
    const angle = Math.atan2(v.frontWheel.y - v.rearWheel.y, v.frontWheel.x - v.rearWheel.x);
    const upX = Math.sin(angle);
    const upY = -Math.cos(angle);

    ctx.save();
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 7;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(v.rearWheel.x, v.rearWheel.y);
    ctx.lineTo(v.frontWheel.x, v.frontWheel.y);
    ctx.lineTo(v.seatFront.x, v.seatFront.y);
    ctx.lineTo(v.seatBack.x, v.seatBack.y);
    ctx.closePath();
    ctx.stroke();

    // Seat backrest & front handlebar
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(v.seatBack.x, v.seatBack.y);
    ctx.lineTo(v.seatBack.x + upX * 32, v.seatBack.y + upY * 32);
    ctx.moveTo(v.seatFront.x, v.seatFront.y);
    ctx.lineTo(v.seatFront.x + upX * 16, v.seatFront.y + upY * 16);
    ctx.stroke();

    ctx.save();
    ctx.translate(v.seatBack.x, (v.seatBack.y + v.rearWheel.y) * 0.5);
    ctx.rotate(angle);
    ctx.fillStyle = state.keys.brake ? '#ff2a2a' : '#475569';
    ctx.fillRect(-16, -7, 18, 14);
    if (state.autoActive && !state.dead && !state.keys.brake) {
      const turbo = state.keys.accel || state.turboBoost > 0.15;
      ctx.fillStyle = state.keys.accel ? '#ffb703' : (turbo ? '#fb923c' : '#38bdf8');
      ctx.beginPath();
      ctx.moveTo(-16, turbo ? -5 : -3.5);
      ctx.lineTo((state.keys.accel ? -36 : -24 - state.turboBoost * 10) - Math.random() * (state.keys.accel ? 14 : 6), 0);
      ctx.lineTo(-16, turbo ? 5 : 3.5);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();

    for (const wNode of [v.rearWheel, v.frontWheel]) {
      ctx.save();
      ctx.translate(wNode.x, wNode.y);
      ctx.fillStyle = '#1e293b';
      ctx.strokeStyle = '#94a3b8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, wNode.r - 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#ffb703';
      ctx.beginPath();
      ctx.arc(0, 0, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawRagdoll() {
    const r = ragdoll;
    ctx.save();
    ctx.lineCap = 'round';

    const drawBone = (bone, width, color) => {
      if (bone.detached) return;
      ctx.strokeStyle = bone.broken ? '#ff4d4d' : color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(bone.a.x, bone.a.y);
      ctx.lineTo(bone.b.x, bone.b.y);
      ctx.stroke();

      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.arc(bone.a.x, bone.a.y, width * 0.32, 0, Math.PI * 2);
      ctx.fill();
    };

    drawBone(r.bones[4], 9, '#eab308');
    drawBone(r.bones[5], 8, '#facc15');
    drawBone(r.bones[8], 10, '#ca8a04');
    drawBone(r.bones[9], 9, '#eab308');
    drawBone(r.bones[1], 16, '#facc15');
    drawBone(r.bones[0], 8, '#eab308');
    drawBone(r.bones[6], 10, '#eab308');
    drawBone(r.bones[7], 9, '#fde047');
    drawBone(r.bones[2], 9, '#facc15');
    drawBone(r.bones[3], 8, '#fde047');

    const ang = Math.atan2(r.head.y - r.chest.y, r.head.x - r.chest.x) + Math.PI / 2;
    ctx.save();
    ctx.translate(r.head.x, r.head.y);
    ctx.rotate(ang);

    ctx.fillStyle = '#fde047';
    ctx.beginPath();
    ctx.arc(0, 0, r.head.r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(0, -1, r.head.r + 1.5, Math.PI * 0.92, Math.PI * 2.08);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(-3, -r.head.r - 2, 6, 8);

    ctx.strokeStyle = '#111827';
    ctx.lineWidth = 2;
    if (state.dead) {
      ctx.beginPath();
      ctx.moveTo(2, -1); ctx.lineTo(7, 4);
      ctx.moveTo(7, -1); ctx.lineTo(2, 4);
      ctx.stroke();
    } else {
      ctx.fillStyle = '#111827';
      ctx.beginPath();
      ctx.arc(5, 1, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
    ctx.restore();
  }

  const touchDock = document.getElementById('touchDock');

  function updateHUD() {
    if (state.dead) {
      state.displayScore = state.score;
    } else {
      state.displayScore += Math.ceil((state.score - state.displayScore) * 0.35);
    }
    syncBestScore();
    uiScore.textContent = `${state.displayScore.toLocaleString()} m`;
    uiBest.textContent = `${bestScore.toLocaleString()} m`;
    uiSpeed.textContent = `${state.speedKmh} km/h`;
    uiLevel.textContent = `Lv.${state.level}`;
    const boostPct = Math.round(state.turboBoost * 100);
    if (turboBoostLabel) {
      turboBoostLabel.textContent = !state.autoActive ? 'TAP TO START' : (boostPct > 2 ? `BOOST +${boostPct}%` : 'HOLD • SPEED UP');
    }
    if (btnAccel) btnAccel.classList.toggle('turbo-hot', boostPct >= 25 && !state.dead);
    if (touchDock) touchDock.classList.toggle('airborne', state.airFrames >= 4 && !state.dead);
  }

  // =========================================================================
  // 6. MAIN 60FPS LOOP & MULTI-TOUCH BINDINGS
  // =========================================================================
  let lastTime = performance.now();
  let accumulator = 0;

  function loop(now) {
    const rawDt = Math.max(0, Math.min(0.05, (now - lastTime) / 1000));
    lastTime = now;

    if (!state.dead) {
      const timeScale = state.slowMo ? 0.35 : 1.0;
      const scaledDt = rawDt * timeScale;
      state.animTime += scaledDt;
      accumulator += scaledDt;

      const FIXED = 1 / 60;
      while (accumulator >= FIXED) {
        stepPhysics();
        accumulator -= FIXED;
        if (state.dead) {
          accumulator = 0;
          break;
        }
      }
    } else {
      accumulator = 0;
    }

    render();
    updateHUD();
    requestAnimationFrame(loop);
  }

  const pointerResetters = [];
  function clearAllInputs() {
    for (const fn of pointerResetters) fn();
    for (const k of Object.keys(state.keys)) state.keys[k] = false;
    state.taps.accel = false;
    state.taps.brake = false;
    document.querySelectorAll('.v-btn.pressed').forEach((b) => b.classList.remove('pressed'));
  }

  // Multi-touch pointer tracking per virtual button
  function bindVirtualButton(el, keyName) {
    const activePointers = new Set();

    const sync = () => {
      const pressed = activePointers.size > 0;
      state.keys[keyName] = pressed;
      el.classList.toggle('pressed', pressed);
    };

    pointerResetters.push(() => {
      activePointers.clear();
      sync();
    });

    el.addEventListener('contextmenu', (e) => e.preventDefault());

    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      sfx.ensure();
      if (el.setPointerCapture) {
        try { el.setPointerCapture(e.pointerId); } catch (_) {}
      }
      if (activePointers.size === 0) {
        state.taps[keyName] = true;
      }
      activePointers.add(e.pointerId);
      sync();
    });

    const release = (e) => {
      e.preventDefault();
      activePointers.delete(e.pointerId);
      sync();
    };

    el.addEventListener('pointerup', release);
    el.addEventListener('pointercancel', release);
    el.addEventListener('lostpointercapture', release);
  }

  const btnBrake = document.getElementById('btnBrake');
  const btnAccel = document.getElementById('btnAccel');

  bindVirtualButton(btnBrake, 'brake');
  bindVirtualButton(btnAccel, 'accel');

  // Hardware keyboard support alongside touch buttons
  window.addEventListener('keydown', (e) => {
    sfx.ensure();
    if (['Space', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      if (!e.repeat) state.taps.accel = true;
      state.keys.accel = true;
      btnAccel.classList.add('pressed');
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'ArrowLeft' || e.code === 'KeyA') {
      if (!e.repeat) state.taps.brake = true;
      state.keys.brake = true;
      btnBrake.classList.add('pressed');
    }
    if (e.code === 'KeyR') resetGame();
  });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'ArrowRight' || e.code === 'KeyD' || e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      state.keys.accel = false;
      btnAccel.classList.remove('pressed');
    }
    if (e.code === 'ArrowDown' || e.code === 'KeyS' || e.code === 'ArrowLeft' || e.code === 'KeyA') {
      state.keys.brake = false;
      btnBrake.classList.remove('pressed');
    }
  });

  document.getElementById('btnSummaryRetry').addEventListener('click', () => {
    sfx.playUiClick();
    resetGame();
  });

  document.getElementById('btnHudRetry').addEventListener('click', () => {
    sfx.playUiClick();
    resetGame();
  });

  const btnSlow = document.getElementById('btnSlow');
  btnSlow.addEventListener('click', () => {
    sfx.playUiClick();
    state.slowMo = !state.slowMo;
    btnSlow.classList.toggle('active', state.slowMo);
  });

  const btnSound = document.getElementById('btnSound');
  btnSound.addEventListener('click', () => {
    sfx.setMuted(!sfx.muted);
    btnSound.textContent = sfx.muted ? '🔇' : '🔊';
    if (!sfx.muted) sfx.playUiClick();
  });

  document.getElementById('courseSelect').addEventListener('change', (e) => {
    sfx.playUiClick();
    state.courseId = parseInt(e.target.value, 10) || 0;
    resetGame();
  });

  window.addEventListener('blur', () => {
    clearAllInputs();
    sfx.pause();
  });
  window.addEventListener('focus', () => sfx.resume());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      clearAllInputs();
      sfx.pause();
    } else {
      sfx.resume();
    }
  });

  if (window.ResizeObserver) {
    new ResizeObserver(() => resizeCanvas()).observe(canvas.parentElement);
  }
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 80));

  resizeCanvas();
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
